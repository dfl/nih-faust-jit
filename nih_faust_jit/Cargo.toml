[package]
name = "nih_faust_jit"
version = "0.1.0"
edition = "2021"
authors = ["Yves Pares <yves.pares@gmail.com>"]
license = "ISC"
homepage = "https://github.com/YPares/nih-faust-jit"
description = "Loading Faust DSP scripts"
default-run = "nih_faust_jit_standalone"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "nih_faust_jit_standalone"
path = "src/standalone.rs"

[dependencies]
faust_jit = { path = "../faust_jit" }
faust_jit_egui = { path = "../faust_jit_egui" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = [
    "assert_process_allocs",
    "standalone",
] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
rfd = "0.14"
serde = "*"
serde_json = "1"
crossbeam = "*"
strum = "*"
strum_macros = "*"
open = "5"
directories = "5"

# Audio file playback (standalone)
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "flac", "pcm", "isomp4", "aac"] }
rubato = "0.15"

# Oversampling
halfband = "0.1"

# Device enumeration (standalone)
cpal = "0.15"
midir = "0.10"

# Signal handling (standalone)
ctrlc = "3"
